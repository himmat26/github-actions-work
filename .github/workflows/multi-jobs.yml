name: multi-job
env:
  APP_NAME: myapp
on:
  workflow_dispatch:

jobs:
  build:
    env:
      ENVIRONMENT: staging
    runs-on: ubuntu-latest
    steps:
      - name: Building the app
        run: echo "Building the app"
        env:
          VERSION: 1.0.0

      - name: Environment variables
        run: |
          echo "App_name: ${{ env.APP_NAME }}
          echo "Environment: ${{ env.ENVIRONMENT }}
          echo "Version: ${{ env.VERSION }}
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Running test
        run: echo "Running tests"
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploying
        run: echo "Deploying"
        
