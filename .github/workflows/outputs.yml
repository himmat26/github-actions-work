name: output
on:
  workflow_dispatch:

jobs:
  set-output:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.set-date.outputs.date}}
    steps:
      - name: sets an output
        id: set-date
        run: echo "date=$(date)" >> $GITHUB_OUTPUT
  read-output:
    runs-on: ubuntu-latest
    needs: set-output
    steps:
      - name: read an output from previous step
        run: | 
          echo "Output: ${{ needs.set-output.outputs.date }}"
      
